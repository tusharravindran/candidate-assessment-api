services:
  - type: web
    runtime: ruby
    name: candidate-assessment-api
    plan: free
    region: oregon
    autoDeployTrigger: commit
    buildCommand: bundle install && bundle exec rails db:migrate && bundle exec bootsnap precompile --gemfile app/ lib/
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /api/v1/health
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: WEB_CONCURRENCY
        value: "0"
      - key: RAILS_MAX_THREADS
        value: "5"
      - key: SIDEKIQ_CONCURRENCY
        value: "2"
      - key: FRONTEND_URL
        value: https://candidate-assessment-web.vercel.app
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DEVISE_JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: candidate-assessment-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: ELASTICSEARCH_URL
        sync: false

  - type: worker
    runtime: ruby
    name: candidate-assessment-api-worker
    plan: starter
    region: oregon
    autoDeployTrigger: commit
    buildCommand: bundle install
    startCommand: bundle exec sidekiq -C config/sidekiq.yml
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MAX_THREADS
        value: "5"
      - key: SIDEKIQ_CONCURRENCY
        value: "2"
      - key: SECRET_KEY_BASE
        fromService:
          type: web
          name: candidate-assessment-api
          envVarKey: SECRET_KEY_BASE
      - key: DEVISE_JWT_SECRET_KEY
        fromService:
          type: web
          name: candidate-assessment-api
          envVarKey: DEVISE_JWT_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: candidate-assessment-postgres
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: ELASTICSEARCH_URL
        sync: false

databases:
  - name: candidate-assessment-postgres
    plan: free
    region: oregon
    databaseName: candidate_assessment
    user: candidate_assessment
    postgresMajorVersion: "16"
