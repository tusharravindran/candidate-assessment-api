services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: candidate_assessment_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/candidate_assessment_development
      REDIS_URL: redis://redis:6379/0
      ELASTICSEARCH_URL: http://elasticsearch:9200
      DEVISE_JWT_SECRET_KEY: local-development-secret
      SECRET_KEY_BASE: local-development-secret-key-base-not-for-production
      FRONTEND_URL: http://localhost:3000
      PORT: 3001
      RAILS_ENV: development
      RAILS_MAX_THREADS: 5
      SIDEKIQ_CONCURRENCY: 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - "3001:3001"
    command: >
      sh -c "bundle exec rails db:create db:migrate &&
             bundle exec rails elasticsearch:create_indices &&
             bundle exec puma -C config/puma.rb"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/candidate_assessment_development
      REDIS_URL: redis://redis:6379/0
      ELASTICSEARCH_URL: http://elasticsearch:9200
      DEVISE_JWT_SECRET_KEY: local-development-secret
      SECRET_KEY_BASE: local-development-secret-key-base-not-for-production
      RAILS_ENV: development
      SIDEKIQ_CONCURRENCY: 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    command: bundle exec sidekiq -C config/sidekiq.yml

  frontend:
    build:
      context: ../candidate-assessment-web
      dockerfile: Dockerfile
    environment:
      # NEXT_PUBLIC_* vars are baked into the browser bundle at build time.
      # Use localhost (host-accessible) not the Docker-internal service name.
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      PORT: 3000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  redis-data:
  elasticsearch-data:
